server {
  listen 80;
  server_name pundad.app www.pundad.app;
  root /srv/pundad/production/current/frontend;
  index index.html;
  client_max_body_size 10M;
  location / { try_files $uri $uri/ /index.html; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /sw.js { add_header Cache-Control "no-cache" always; }
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }
  location = /__version.json { add_header Cache-Control "no-store" always; }
  location = /__build.json { add_header Cache-Control "no-store" always; }
  location ^~ /assets/ {
    try_files $uri /.retained-assets$uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 = @asset_missing;
  }
  location ^~ /.retained-assets/ { internal; }
  location @asset_missing {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
  }
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /uploads/ {
    alias /var/www/pundad-uploads/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }
}
